<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>М13</title>
  <!-- Подключение современного акцидентного шрифта -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #0f0f0f;
    }

    /* Фоновая картинка на весь экран */
    .background {
      width: 100%;
      height: 100%;
      background-image: url('М13.png'); /* Картинка с русской буквой М */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Чистый текст во весь экран с эффектом жидкого стекла прямо на нем */
    .title {
      font-family: 'Syncopate', sans-serif;
      font-size: 28vw; /* Растягивает по ширине окна */
      line-height: 0.8;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-transform: uppercase;
      text-align: center;
      letter-spacing: -0.05em;
      user-select: none;

      /* Эффект Liquid Glass непосредственно на тексте */
      backdrop-filter: url(#liquidFilter) blur(3px);
      -webkit-backdrop-filter: url(#liquidFilter) blur(3px);
    }

    /* Скрытие SVG-контейнера */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- SVG-фильтр для эффекта -->
  <svg class="svg-filters">
    <defs>
      <filter id="liquidFilter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="background">
    <h1 class="title">М13</h1>
  </main>

</body>
</html>
