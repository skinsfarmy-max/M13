<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>М13</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f0f0f;
    }

    /* Фона с русской буквой М в названии */
    .background {
      width: 100%;
      height: 100%;
      background-image: url('М13.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Контейнер SVG на весь экран */
    .stage {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Текст в SVG, на который накладывается фильтр */
    .title-text {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      fill: rgba(255, 255, 255, 0.95);
      
      /* Запрошенный эффект Liquid Glass */
      backdrop-filter: url(#liquidFilter) blur(3px);
      -webkit-backdrop-filter: url(#liquidFilter) blur(3px);
    }
  </style>
</head>
<body>

  <!-- SVG-фильтр жидкого стекла -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;">
    <defs>
      <filter id="liquidFilter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <main class="background">
    <!-- preserveAspectRatio="none" дает полное растяжение по WxH -->
    <svg class="stage" viewBox="0 0 1000 500" preserveAspectRatio="none">
      <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" class="title-text">
        М13
      </text>
    </svg>
  </main>

</body>
</html>
