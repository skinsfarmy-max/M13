<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M13</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      color: #fff;
      background: #0f0f0f;
      overflow-x: hidden;
    }

    /* Фоновое изображение */
    .background {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: url('M13.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .content {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Карточка с эффектом жидкого стекла на всю ширину */
    .liquid-card {
      width: 100%;
      padding: 3rem 1.5rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      text-align: center;

      /* Запрошенный эффект liquid glass */
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: url(#liquidFilter) blur(3px);
      -webkit-backdrop-filter: url(#liquidFilter) blur(3px);
    }

    .liquid-card:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Главная надпись М13 по всей ширине */
    .gang-title {
      font-size: clamp(4rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      width: 100%;
      margin: 0;
      user-select: none;
    }

    /* Скрытие самого SVG-контейнера */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Описание SVG-фильтра liquidFilter для корректной работы эффекта -->
  <svg class="svg-filters">
    <defs>
      <filter id="liquidFilter" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </defs>
  </svg>

  <div class="background">
    <main class="content">
      <div class="liquid-card">
        <h1 class="gang-title">М13</h1>
      </div>
    </main>
  </div>

</body>
</html>
